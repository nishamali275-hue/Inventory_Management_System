version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: inventory_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=inventory_db
    networks:
      - inventory_network

  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/inventory_db
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - REDIS_DEFAULT_TTL=300
      - JWT_SECRET=supersecretjwtkey_inventory_mgmt_2026!
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    depends_on:
      - mongodb
      - redis
    volumes:
      - backend_uploads:/usr/src/app/uploads
    networks:
      - inventory_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - inventory_network

volumes:
  mongo_data:
  redis_data:
  backend_uploads:

networks:
  inventory_network:
    driver: bridge
